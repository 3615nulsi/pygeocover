[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeocover"
version = "0.1.0"
description = "Client asynchrone non officiel pour l'API Decathlon Geocover (Conneqtech)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9"]
license = {text = "MIT"}
authors = [{name = "3615nulsi"}]
classifiers = ["Framework :: AsyncIO", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/3615nulsi/pygeocover"
Issues = "https://github.com/3615nulsi/pygeocover/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pygeocover = "pygeocover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygeocover = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
